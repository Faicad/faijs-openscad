name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Keep this workflow STEP-ALIGNED with scripts/ci.ps1 (local Windows CI).
# Both pipelines must run the same logical stages in the same order:
#   lint -> typecheck -> build -> test (+stderr zero tolerance) -> pack.
# If you add/remove/reorder a step here, mirror it in ci.ps1 (and vice versa).
jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [24]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # 1/5
      - name: Lint
        run: npm run lint

      # 2/5 — typecheck before build: legal-ESM fix-import-extensions runs at build.
      - name: Typecheck
        run: npm run typecheck

      # 3/5 — build produces dist/.
      - name: Build
        run: npm run build

      # 4/5 — run the suite under the same hard external watchdog as ci.ps1,
      # with stderr zero tolerance (a failing native call leaks "stderr |" lines).
      # Regular CI must NOT depend on an OpenSCAD binary: corpus/e2e layers are
      # separated out (see plan §9.7) and only run where OPENSCAD_SRC is provided.
      - name: Test (hard watchdog + stderr zero tolerance)
        run: |
          set -o pipefail
          node scripts/run-tests-with-watchdog.mjs --budget-ms "${FAIJS_TEST_BUDGET_MS:-300000}" -- npm run test 2>&1 | tee vitest-ci.log
          rc=$?
          if grep -E '^stderr \|' vitest-ci.log; then
            echo "::error::Tests produced stderr output — all test stderr must be resolved."
            rc=1
          fi
          rm -f vitest-ci.log
          exit $rc

      # 5/5
      - name: npm pack (local packability)
        run: npm pack
